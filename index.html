<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EB;
    --surface: #FFFFFF;
    --surface-alt: #F5EBDA;
    --border: #E3D2B8;
    --text: #22232B;
    --text-muted: #8D8D97;
    --primary: #9CAF88;
    --primary-dim: #F0F3ED;
    --green: #4CA771;
    --green-dim: #E9F5EE;
    --amber: #D6A23A;
    --amber-dim: #FBF3DE;
    --red: #D9695C;
    --red-dim: #FBEAE7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary) !important; }
  .display-title { font-family: 'Sora', sans-serif; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; position: relative; }
  #app.has-nav { padding-bottom: 78px; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 26px 20px; text-align: center; }
  .header-inner { display: flex; justify-content: center; align-items: center; gap: 9px; }
  .logo-badge { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-dim); display: flex; align-items: center; justify-content: center; }
  .app-title { font-size: 26px; font-weight: 700; margin: 0; }

  .content { padding: 0 16px; }

  .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); transition: transform .15s; }
  .chip:hover { transform: translateY(-1px); }
  .chip.active { color: #fff; }

  .search-wrap { position: relative; margin-top: 4px; margin-bottom: 8px; }
  .search-wrap input[type=text] { width: 100%; padding: 10px 12px 10px 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); padding: 2px; }

  .sort-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .sort-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-right: 2px; }
  .sort-chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: transparent; color: var(--text-muted); }
  .sort-chip.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }
  .genre-select { margin-left: auto; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); }
  .genre-select.active { border-color: var(--primary); background: var(--primary-dim); color: var(--primary); }

const AVATAR_PALETTE = ["#9CAF88", "#4CA771", "#D9695C", "#8C7AE6", "#D6A23A", "#4FA0D9", "#E07A5F"];
function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
}

function applyScore(show, index, groupSize, tier) {
  const [top, bottom] = TIERS[tier].range;
  const score = groupSize === 1 ? top : Math.round((top - (index * (top - bottom)) / (groupSize - 1)) * 10) / 10;
  return Object.assign({}, show, { order: index, score });
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());

  state.shows = next;
  try { localStorage.setItem("tevo_shows", JSON.stringify(next)); } catch (e) {}
}

function persistProfile(next) {
  state.profile = next;
  try { localStorage.setItem("tevo_profile", JSON.stringify(next)); } catch (e) {}
}

/* ---------------- core ranking logic (mirrors the verified chat-artifact version) ---------------- */

function resetForm() {
  state.form = { name: "", tier: null, note: "", genre: "", poster: null, pickedName: "" };
  state.searchResults = [];
  state.error = "";
}

function goAdd() { resetForm(); state.view = "add"; render(); }
function goList() { resetForm(); state.compareState = null; state.selectedShowId = null; state.view = "list"; render(); }
function openDetail(id) { state.selectedShowId = id; state.view = "detail"; render(); }

function updateShowMeta(id, updates) {
  const next = state.shows.map((s) => (s.id === id ? Object.assign({}, s, updates) : s));
  persistShows(next);
}

function submitForm() {
  const f = state.form;
  if (!f.name.trim()) { state.error = "Give the show a name."; render(); return; }
  if (!f.tier) { state.error = "Choose Liked, Fine, or Didn't like it."; render(); return; }

  const newShow = {
    id: uid(), name: f.name.trim(), tier: f.tier,
    note: f.note.trim(), genre: f.genre.trim(),
    poster: f.poster || null, addedAt: Date.now(),
  };

  const group = state.shows.filter((s) => s.tier === f.tier).sort((a, b) => a.order - b.order);

  if (group.length === 0) {
    persistShows([...state.shows, applyScore(newShow, 0, 1, f.tier)]);
    goList();
    return;
  }

  const lo = 0, hi = group.length, mid = Math.floor(hi / 2);
  state.compareState = { newShow, tier: f.tier, group, lo, hi, mid, initialSize: group.length };
  state.view = "compare";
  render();
}

function finalizeInsertion(insertIndex) {
  const { newShow, tier, group, rerankBase } = state.compareState;
  const orderedIds = [
    ...group.slice(0, insertIndex).map((s) => s.id),
    newShow.id,
    ...group.slice(insertIndex).map((s) => s.id),
  ];
  const baseArray = rerankBase || state.shows;
  const others = baseArray.filter((s) => s.tier !== tier);
  const updatedGroup = orderedIds.map((id, idx) => {
    const src = id === newShow.id ? newShow : group.find((s) => s.id === id);
    return applyScore(src, idx, orderedIds.length, tier);
  });
  persistShows([...others, ...updatedGroup]);
  goList();
}

function handleChoice(outcome) {
  const { lo, hi, mid } = state.compareState;
  if (outcome === "tie") { finalizeInsertion(mid); return; }
  let newLo = lo, newHi = hi;
  if (outcome === "existing") newLo = mid + 1; else newHi = mid;
  if (newLo >= newHi) { finalizeInsertion(newLo); return; }
  state.compareState = Object.assign({}, state.compareState, { lo: newLo, hi: newHi, mid: Math.floor((newLo + newHi) / 2) });
  render();
}

function startRerank(show, newTier) {
  const oldTier = show.tier;
  const others = state.shows.filter((s) => s.id !== show.id);
  const oldGroupRemaining = others.filter((s) => s.tier === oldTier).sort((a, b) => a.order - b.order);
  const oldRescored = oldGroupRemaining.map((s, idx) => applyScore(s, idx, oldGroupRemaining.length, oldTier));
  const untouched = others.filter((s) => s.tier !== oldTier);
  const baseShows = [...untouched, ...oldRescored];

  const newShow = Object.assign({}, show, { tier: newTier });
  const newGroup = baseShows.filter((s) => s.tier === newTier).sort((a, b) => a.order - b.order);

  if (newGroup.length === 0) {
    persistShows([...baseShows, applyScore(newShow, 0, 1, newTier)]);
    goList();
    return;
  }

  const lo = 0, hi = newGroup.length, mid = Math.floor(hi / 2);
  state.compareState = { newShow, tier: newTier, group: newGroup, lo, hi, mid, initialSize: newGroup.length, rerankBase: baseShows };
  state.view = "compare";
  render();
}

function deleteShow(id) {
  const target = state.shows.find((s) => s.id === id);
  if (!target) return;
  const prevShows = state.shows;
  const rest = state.shows.filter((s) => s.id !== id);
  const group = rest.filter((s) => s.tier === target.tier).sort((a, b) => a.order - b.order);
  const rescored = group.map((s, idx) => applyScore(s, idx, group.length, target.tier));
  const others = rest.filter((s) => s.tier !== target.tier);
  persistShows([...others, ...rescored]);

  if (undoTimer) clearTimeout(undoTimer);
  state.undo = { snapshot: prevShows, name: target.name };
  undoTimer = setTimeout(() => { state.undo = null; render(); }, 5000);
  render();
}

function handleUndo() {
  if (!state.undo) return;
  if (undoTimer) clearTimeout(undoTimer);
  persistShows(state.undo.snapshot);
  state.undo = null;
  render();
}

/* ---------------- live search (TVMaze, falls back to local list) ---------------- */

async function liveSearch(query) {
  const q = query.trim();
  if (q.length < 2) { state.searchResults = []; state.searching = false; renderSearchDropdown(); return; }
  state.searching = true;
  try {
    const res = await fetch("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(q));
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    state.searchResults = data.slice(0, 7).map((d) => ({
      name: d.show.name,
      poster: d.show.image ? (d.show.image.medium || d.show.image.original) : null,
      genre: (d.show.genres && d.show.genres[0]) || "",
    }));
  } catch (e) {
    const ql = q.toLowerCase();
    state.searchResults = SHOW_DATABASE.filter((n) => n.toLowerCase().includes(ql)).slice(0, 7)
      .map((n) => ({ name: n, poster: null, genre: "" }));
  }
  state.searching = false;
  renderSearchDropdown();
}

/* ---------------- rendering ---------------- */

function tvIconSvg(size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M7 3.5L12 8L17 3.5" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<rect x="3" y="8" width="18" height="12.5" rx="2.5" stroke="' + color + '" stroke-width="1.8"/>' +
    '<circle cx="17.3" cy="13" r="0.9" fill="' + color + '"/>' +
    '<circle cx="17.3" cy="16.3" r="0.9" fill="' + color + '"/>' +
    '<path d="M5.5 20.5L7.5 23" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round"/>' +
    '<path d="M18.5 20.5L16.5 23" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round"/>' +
    '</svg>';
}

function iconSvg(name, size, color) {
  color = color || "currentColor";
  const icons = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>',
    back: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    user: '<path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/>',
    camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
    sort: '<path d="M3 16l4 4 4-4M7 20V4M21 8l-4-4-4 4M17 4v16"/>',
    note: '<path d="M4 4h13l3 3v13H4z"/><path d="M17 4v6h4"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    film: '<rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/>',
  };
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">' + (icons[name] || "") + '</svg>';
}

function avatarHtml(show, size, radius) {
  const w = size, h = Math.round(size * 1.25);
  radius = radius || 8;
  if (show.poster) {
    return '<div class="avatar" style="width:' + w + 'px;height:' + h + 'px;border-radius:' + radius + 'px;background-image:url(\'' + show.poster.replace(/'/g, "%27") + '\')"></div>';
  }
  const color = avatarColor(show.name || "?");
  const letter = (show.name || "?").trim().charAt(0).toUpperCase() || "?";
  return '<div class="avatar" style="width:' + w + 'px;height:' + h + 'px;border-radius:' + radius + 'px;background:' + color + '1A;border:1px solid ' + color + '40">' +
    '<span class="avatar-letter" style="font-size:' + Math.round(size * 0.46) + 'px;color:' + color + '">' + escapeHtml(letter) + '</span></div>';
}

function posterCardHtml(show, rank) {
  const color = avatarColor(show.name);
  const tier = TIERS[show.tier];
  const bg = show.poster
    ? 'background-image:url(\'' + show.poster.replace(/'/g, "%27") + '\')'
    : 'background-image:linear-gradient(155deg, ' + color + ', ' + color + 'CC 55%, #33302B)';
  return '<div class="poster-card" style="' + bg + '">' +
    '<div class="poster-rank">' + rank + '</div>' +
    '<div class="poster-score" style="background:' + tier.hex + '">' + show.score.toFixed(1) + '</div>' +
    '<div class="poster-title-wrap"><p class="poster-title display-title">' + escapeHtml(show.name) + '</p></div>' +
    '</div>';
}

function render() {
  const app = document.getElementById("app");
  const showNav = state.view === "list";
  app.className = showNav ? "has-nav" : "";

  let body = "";
  if (state.view === "list" && state.page === "rankings") body = renderListView();
  else if (state.view === "list" && state.page === "profile") body = renderProfileView();
  else if (state.view === "add") body = renderAddView();
  else if (state.view === "compare" && state.compareState) body = renderCompareView();
  else if (state.view === "detail" && getSelectedShow()) body = renderDetailView();

  app.innerHTML =
    '<div class="header"><div class="header-inner">' +
      '<div class="logo-badge">' + tvIconSvg(17, "#9CAF88") + '</div>' +
      '<h1 class="app-title display-title">tevo</h1>' +
    '</div></div>' +
    '<div class="content">' + body + '</div>' +
    (state.undo ? renderToast() : "") +
    (showNav ? renderBottomNav() : "");

  attachHandlers();
}

function getSelectedShow() {
  return state.selectedShowId ? state.shows.find((s) => s.id === state.selectedShowId) : null;
}

function getVisibleShows() {
  const q = state.rankSearch.trim().toLowerCase();
  return state.shows
    .filter((s) => state.filterTier === "All" || s.tier === state.filterTier)
    .filter((s) => state.filterGenre === "All" || s.genre === state.filterGenre)
    .filter((s) => s.name.toLowerCase().includes(q))
    .sort((a, b) => {
      if (state.sortMode === "alpha") return a.name.localeCompare(b.name);
      if (state.sortMode === "newest") return (b.addedAt || 0) - (a.addedAt || 0);
      return b.score - a.score;
    });
}

function getAllGenres() {
  return Array.from(new Set(state.shows.map((s) => s.genre).filter(Boolean))).sort();
}

function renderBottomNav() {
  const items = [
    { key: "rankings", label: "Rankings", icon: tvIconSvg(20, state.page === "rankings" ? "#9CAF88" : "#8D8D97") },
    { key: "profile", label: "Profile", icon: iconSvg("user", 20, state.page === "profile" ? "#9CAF88" : "#8D8D97") },
  ];
  return '<div class="bottom-nav"><div class="bottom-nav-inner">' +
    items.map((it) =>
      '<button class="nav-item ' + (state.page === it.key ? "active" : "") + '" data-action="set-page" data-page="' + it.key + '">' +
      it.icon + '<span>' + it.label + '</span></button>'
    ).join("") +
    '</div></div>';
}

function renderToast() {
  return '<div class="toast ' + (state.view === "list" ? "with-nav" : "") + '">' +
    '<span class="toast-text">Removed "' + escapeHtml(state.undo.name) + '"</span>' +
    '<button class="toast-undo" data-action="undo-delete">Undo</button>' +
    '</div>';
}

function renderListView() {
  const visible = getVisibleShows();
  const allGenres = getAllGenres();

  let tabs = ["All", ...TIER_ORDER].map((t) => {
    const label = t === "All" ? "All" : TIERS[t].short;
    const active = state.filterTier === t;
    const color = t === "All" ? "#9CAF88" : TIERS[t].hex;
    return '<button class="chip ' + (active ? "active" : "") + '" data-action="set-filter-tier" data-tier="' + t + '" ' +
      'style="border-color:' + (active ? color : "var(--border)") + ';background:' + (active ? color : "var(--surface)") + '">' + label + '</button>';
  }).join("");

  let sortChips = [
    { key: "score", label: "Score" }, { key: "alpha", label: "A–Z" }, { key: "newest", label: "Newest" },
  ].map((opt) =>
    '<button class="sort-chip ' + (state.sortMode === opt.key ? "active" : "") + '" data-action="set-sort" data-sort="' + opt.key + '">' + opt.label + '</button>'
  ).join("");

  let genreOptions = '<option value="All">All genres</option>' + allGenres.map((g) => '<option value="' + escapeHtml(g) + '" ' + (state.filterGenre === g ? "selected" : "") + '>' + escapeHtml(g) + '</option>').join("");

  let listHtml;
  if (!state.loaded) {
    listHtml = '<p class="loading-state">Loading your list…</p>';
  } else if (visible.length === 0) {
    listHtml = '<div class="empty-state">' + iconSvg("film", 30, "var(--border)") +
      '<p style="margin:10px 0 0;font-size:14px">' + (state.rankSearch ? "No shows match that search." : "Nothing ranked yet. Add a show above to get started.") + '</p></div>';
  } else {
    listHtml = visible.map((s, i) => {
      const tier = TIERS[s.tier];
      return '<div class="row-card" data-action="open-detail" data-id="' + s.id + '">' +
        '<span class="row-rank mono">' + (i + 1) + '</span>' +
        avatarHtml(s, 38) +
        '<div class="row-info">' +
          '<p class="row-name">' + escapeHtml(s.name) + '</p>' +
          '<p class="row-meta" style="color:' + tier.hex + '">' +
            '<span>' + tier.short + '</span>' +
            (s.genre ? '<span class="row-genre">· ' + escapeHtml(s.genre) + '</span>' : "") +
            (s.note ? '<span class="row-note">· ' + escapeHtml(s.note) + '</span>' : "") +
          '</p>' +
        '</div>' +
        '<div class="score-bubble mono" style="background:' + tier.hex + '">' + s.score.toFixed(1) + '</div>' +
        '<button class="row-trash" data-action="delete-show" data-id="' + s.id + '">' + iconSvg("trash", 16, "var(--text-muted)") + '</button>' +
      '</div>';
    }).join("");
  }

  return '<div style="padding-top:18px">' +
    '<div class="chip-row">' + tabs + '</div>' +
    '<div class="search-wrap">' +
      '<span class="search-icon">' + iconSvg("search", 15, "#8D8D97") + '</span>' +
      '<input type="text" id="rankSearchInput" placeholder="Search your list…" value="' + escapeHtml(state.rankSearch) + '">' +
      (state.rankSearch ? '<button class="search-clear" data-action="clear-rank-search">' + iconSvg("x", 15, "#8D8D97") + '</button>' : "") +
    '</div>' +
    '<div class="sort-row">' + iconSvg("sort", 13, "#8D8D97") + '<span class="sort-label">Sort:</span>' + sortChips +
      '<select class="genre-select ' + (state.filterGenre !== "All" ? "active" : "") + '" id="genreFilterSelect">' + genreOptions + '</select>' +
    '</div>' +
    '<button class="add-btn" data-action="go-add">' + iconSvg("plus", 17, "#9CAF88") + ' Add a show</button>' +
    '<div class="show-list">' + listHtml + '</div>' +
  '</div>';
}

function renderSearchDropdown() {
  const wrap = document.getElementById("searchDropdownWrap");
  if (!wrap) return;
  if (state.searching) {
    wrap.innerHTML = '<p class="title-search-hint">Searching…</p>';
    return;
  }
  if (!state.form.pickedName && state.searchResults.length === 0 && state.form.name.trim().length >= 2) {
    wrap.innerHTML = '<p class="title-search-hint">No matches — that\'s fine, just fill in the tier below.</p>';
    return;
  }
  if (state.form.pickedName || state.searchResults.length === 0) { wrap.innerHTML = ""; return; }
  wrap.innerHTML = '<div class="search-dropdown">' +
    state.searchResults.map((r, idx) =>
      '<button class="search-result" data-action="pick-search-result" data-idx="' + idx + '">' +
        avatarHtml({ name: r.name, poster: r.poster }, 30) +
        '<div><p class="search-result-name">' + escapeHtml(r.name) + '</p>' +
        (r.genre ? '<p class="search-result-meta">' + escapeHtml(r.genre) + '</p>' : '') + '</div>' +
      '</button>'
    ).join("") +
  '</div>';
}

function renderAddView() {
  const f = state.form;
  const chipGenres = Array.from(new Set([...GENRE_PRESETS, ...getAllGenres()]));

  let tierButtons = TIER_ORDER.map((key) => {
    const t = TIERS[key];
    const active = f.tier === key;
    return '<button class="tier-btn" data-action="set-form-tier" data-tier="' + key + '" ' +

      t.label + '</button>';
  }).join("");

  let genreChips = chipGenres.map((g) => {
    const active = f.genre === g;
    return '<button class="genre-chip ' + (active ? "active" : "") + '" data-action="toggle-form-genre" data-genre="' + escapeHtml(g) + '">' + escapeHtml(g) + '</button>';
  }).join("");

  return '<div style="padding-top:18px">' +
    '<button class="back-btn" data-action="go-list">' + iconSvg("back", 15, "#8D8D97") + ' Back</button>' +
    '<label class="field-label">SHOW NAME</label>' +
    '<div class="title-search-wrap">' +
      '<span class="title-search-icon">' + iconSvg("search", 16, "#8D8D97") + '</span>' +
      '<input type="text" id="titleSearchInput" placeholder="e.g. The Bear" value="' + escapeHtml(f.name) + '">' +
      (f.pickedName ? '<span class="title-search-check">' + iconSvg("check", 16, "#9CAF88") + '</span>' : "") +

    '</div>' +

      '<span class="note-icon">' + iconSvg("note", 15, "#8D8D97") + '</span>' +

    '</div>' +

  '</div>';
}

function renderCompareView() {
  const cs = state.compareState;
  const existing = cs.group[cs.mid];
  const t = TIERS[cs.tier];
  const totalSteps = Math.max(1, Math.ceil(Math.log2(cs.initialSize + 1)));
  const stepsLeft = Math.max(1, Math.ceil(Math.log2(Math.max(cs.hi - cs.lo, 1) + 1)));
  const progress = Math.min(1, 1 - stepsLeft / totalSteps);

  return '<div style="padding-top:18px">' +
    '<button class="back-btn" data-action="go-list">' + iconSvg("back", 15, "#8D8D97") + ' Cancel</button>' +
    '<div style="text-align:center">' +
      '<span class="compare-badge" style="background:' + t.hexDim + ';color:' + t.hex + '">' + t.label.toUpperCase() + '</span>' +
      '<h2 class="compare-title display-title">Which did you like more?</h2>' +
    '</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + (progress * 100) + '%"></div></div>' +
    '<div class="compare-row">' +
      '<button class="compare-card" data-action="choice" data-outcome="new">' +
        avatarHtml(cs.newShow, 76, 8) +
        '<span style="font-weight:700;font-size:15px;text-align:center">' + escapeHtml(cs.newShow.name) + '</span>' +
        '<span style="font-size:11px;color:var(--text-muted)">NEW</span>' +
      '</button>' +
      '<div class="vs-col"><span class="vs-label display-title">VS</span></div>' +
      '<button class="compare-card" data-action="choice" data-outcome="existing">' +
        avatarHtml(existing, 76, 8) +
        '<span style="font-weight:700;font-size:15px;text-align:center">' + escapeHtml(existing.name) + '</span>' +
        '<span class="mono" style="font-size:11px;color:var(--text-muted)">' + existing.score.toFixed(1) + '</span>' +
      '</button>' +
    '</div>' +
    '<button class="tie-btn" data-action="choice" data-outcome="tie">Too close to call</button>' +
  '</div>';
}

function renderDetailView() {
  const show = getSelectedShow();
  const tier = TIERS[show.tier];

  let tierButtons = TIER_ORDER.map((key) => {

    return '<button class="tier-btn" data-action="rerank" data-tier="' + key + '" ' + (isCurrent ? "disabled" : "") + ' ' +

      t.label + (isCurrent ? iconSvg("check", 15, t.hex) : "") + '</button>';
  }).join("");

  let genreChips = chipGenres.map((g) => {
    const active = state.detailGenreDraft === g;
    return '<button class="genre-chip ' + (active ? "active" : "") + '" data-action="toggle-detail-genre" data-genre="' + escapeHtml(g) + '">' + escapeHtml(g) + '</button>';
  }).join("");

  return '<div style="padding-top:18px">' +
    '<button class="back-btn" data-action="go-list">' + iconSvg("back", 15, "#8D8D97") + ' Back</button>' +
    '<div class="detail-header">' +
      avatarHtml(show, 54) +
      '<div><h2 class="detail-title display-title">' + escapeHtml(show.name) + '</h2>' +
        '<div class="detail-badges">' +
          '<span class="tier-pill" style="color:' + tier.hex + ';background:' + tier.hexDim + '">' + tier.short + '</span>' +
          '<span class="mono" style="font-size:12px;color:var(--text-muted)">' + show.score.toFixed(1) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<label class="field-label">CHANGE RATING</label>' +
    '<div class="tier-btn-list">' + tierButtons + '</div>' +
    '<label class="field-label">GENRE</label>' +
    '<div class="genre-chip-row">' + genreChips + '</div>' +
    '<label class="field-label">NOTE</label>' +
    '<textarea class="note-textarea" id="detailNoteInput" rows="3" placeholder="e.g. watched with Sam, rewatch of season 1 only…">' + escapeHtml(state.detailNoteDraft != null ? state.detailNoteDraft : (show.note || "")) + '</textarea>' +
    '<button class="save-btn ' + (state.detailSaved ? "saved" : "") + '" data-action="save-detail">' +
      (state.detailSaved ? (iconSvg("check", 16, "var(--green)") + ' Saved') : "Save changes") +
    '</button>' +
    '<button class="danger-btn" data-action="delete-detail">' + iconSvg("trash", 15, "var(--red)") + ' Remove from list</button>' +
  '</div>';
}

function renderProfileView() {
  const p = state.profile;
  const topShows = [...state.shows].sort((a, b) => b.score - a.score).slice(0, 5);
  const recentShows = [...state.shows].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0)).slice(0, 8);

  const genreCounts = {};
  state.shows.forEach((s) => { if (s.genre) genreCounts[s.genre] = (genreCounts[s.genre] || 0) + 1; });
  const topGenreEntry = Object.entries(genreCounts).sort((a, b) => b[1] - a[1])[0];
  const mostRecentShow = state.shows.length ? [...state.shows].sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0))[0] : null;

  const stats = {
    total: state.shows.length,
    topGenre: topGenreEntry ? topGenreEntry[0] : "—",
    mostRecent: mostRecentShow ? mostRecentShow.name : "—",
  };

  return '<div class="profile-view">' +
    '<div class="avatar-circle-wrap">' +
      '<div class="avatar-circle">' + (p.photo ? '<img src="' + p.photo + '">' : iconSvg("user", 38, "#8D8D97")) + '</div>' +
      '<button class="camera-btn" data-action="pick-photo">' + iconSvg("camera", 14, "#fff") + '</button>' +
    '</div>' +
    '<div style="margin-top:14px">' +
      (state.editingName
        ? '<input class="profile-name-input" id="profileNameInput" placeholder="Your name" value="' + escapeHtml(p.name || "") + '">'
        : '<button class="profile-name-btn display-title" data-action="edit-name" style="color:' + (p.name ? "var(--text)" : "var(--text-muted)") + ';font-style:' + (p.name ? "normal" : "italic") + '">' + (escapeHtml(p.name) || "Add your name") + '</button>') +
    '</div>' +
    '<div class="stat-row">' +
      '<div class="stat-tile"><p class="stat-value display-title">' + stats.total + '</p><p class="stat-label">Total Watched</p></div>' +
      '<div class="stat-tile"><p class="stat-value small display-title">' + escapeHtml(stats.topGenre) + '</p><p class="stat-label">Top Genre</p></div>' +
      '<div class="stat-tile"><p class="stat-value small display-title">' + escapeHtml(stats.mostRecent) + '</p><p class="stat-label">Most Recent</p></div>' +
    '</div>' +
    '<div class="shelf-section">' +
      '<p class="shelf-heading display-title">Top 5</p>' +
      (topShows.length === 0
        ? '<p class="shelf-empty">Rank some shows to see your top 5 here.</p>'
        : '<div class="shelf-row">' + topShows.map((s, i) => posterCardHtml(s, i + 1)).join("") + '</div>') +
    '</div>' +
    '<div class="shelf-section">' +
      '<p class="shelf-heading display-title">Recently Added</p>' +
      (recentShows.length === 0
        ? '<p class="shelf-empty">Shows you add will show up here, most recent first.</p>'
        : '<div class="shelf-row">' + recentShows.map((s, i) => posterCardHtml(s, i + 1)).join("") + '</div>') +
    '</div>' +
  '</div>';
}

/* ---------------- events ---------------- */

function rerenderPreservingFocus() {
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  render();
  if (id) {
    const el = document.getElementById(id);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function resizeImageFile(file, maxSize, quality) {
  maxSize = maxSize || 320; quality = quality || 0.85;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function attachHandlers() {
  const app = document.getElementById("app");

  app.onclick = (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    if (action === "set-page") { state.page = el.dataset.page; render(); }
    else if (action === "go-add") { goAdd(); }
    else if (action === "go-list") { goList(); }
    else if (action === "open-detail") { state.detailNoteDraft = null; state.detailGenreDraft = undefined; state.detailSaved = false; openDetail(el.dataset.id); }
    else if (action === "delete-show") { e.stopPropagation(); deleteShow(el.dataset.id); }
    else if (action === "undo-delete") { handleUndo(); }
    else if (action === "set-filter-tier") { state.filterTier = el.dataset.tier; render(); }
    else if (action === "set-sort") { state.sortMode = el.dataset.sort; render(); }
    else if (action === "clear-rank-search") { state.rankSearch = ""; render(); }
    else if (action === "set-form-tier") { state.form.tier = el.dataset.tier; render(); }
    else if (action === "toggle-form-genre") {
      const g = el.dataset.genre;
      state.form.genre = state.form.genre === g ? "" : g;
      render();
    }
    else if (action === "submit-form") { submitForm(); }
    else if (action === "pick-search-result") {
      const r = state.searchResults[parseInt(el.dataset.idx, 10)];
      if (r) {
        state.form.name = r.name;
        state.form.pickedName = r.name;
        state.form.poster = r.poster;
        if (r.genre) state.form.genre = r.genre;
        state.searchResults = [];
        render();
      }
    }
    else if (action === "choice") { handleChoice(el.dataset.outcome); }
    else if (action === "rerank") { if (!el.disabled) startRerank(getSelectedShow(), el.dataset.tier); }
    else if (action === "toggle-detail-genre") {
      const g = el.dataset.genre;
      const show = getSelectedShow();
      const current = state.detailGenreDraft !== undefined ? state.detailGenreDraft : (show.genre || "");
      state.detailGenreDraft = current === g ? "" : g;
      render();
    }
    else if (action === "save-detail") {
      const show = getSelectedShow();
      const note = (state.detailNoteDraft != null ? state.detailNoteDraft : (show.note || "")).trim();
      const genre = (state.detailGenreDraft !== undefined ? state.detailGenreDraft : (show.genre || "")).trim();
      updateShowMeta(show.id, { note, genre });
      state.detailSaved = true;
      render();
      setTimeout(() => { state.detailSaved = false; render(); }, 1200);
    }
    else if (action === "delete-detail") {
      const show = getSelectedShow();
      deleteShow(show.id);
      goList();
    }
    else if (action === "pick-photo") { document.getElementById("fileInput").click(); }
    else if (action === "edit-name") { state.editingName = true; render(); setTimeout(() => { const i = document.getElementById("profileNameInput"); if (i) { i.focus(); i.select(); } }, 0); }
  };

  app.oninput = (e) => {
    const t = e.target;
    if (t.id === "rankSearchInput") { state.rankSearch = t.value; rerenderPreservingFocus(); }
    else if (t.id === "titleSearchInput") {
      state.form.name = t.value;
      state.form.pickedName = "";
      state.form.poster = null;
      clearTimeout(searchDebounce);
      const q = t.value;
      searchDebounce = setTimeout(() => liveSearch(q), 350);
      state.searchResults = [];
      renderSearchDropdown();
    }
    else if (t.id === "formNoteInput") { state.form.note = t.value; }
    else if (t.id === "detailNoteInput") { state.detailNoteDraft = t.value; }
    else if (t.id === "profileNameInput") { /* saved on blur/enter */ }
  };

  app.onchange = (e) => {
    if (e.target.id === "genreFilterSelect") { state.filterGenre = e.target.value; render(); }
  };

  app.onfocusin = (e) => {
    if (e.target.id === "titleSearchInput" && state.searchResults.length > 0) renderSearchDropdown();
  };

  app.onkeydown = (e) => {
    if (e.target.id === "profileNameInput" && e.key === "Enter") { e.target.blur(); }
  };

  app.onfocusout = (e) => {
    if (e.target.id === "profileNameInput") {
      persistProfile(Object.assign({}, state.profile, { name: e.target.value.trim() }));
      state.editingName = false;
      render();
    }
  };

  const fileInput = document.getElementById("fileInput");
  fileInput.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageFile(file);
      persistProfile(Object.assign({}, state.profile, { photo: dataUrl }));
      render();
    } catch (err) {}
    e.target.value = "";
  };
}

/* ---------------- boot ---------------- */

loadState();
render();
</script>
</body>
</html>
